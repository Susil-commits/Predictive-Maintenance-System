name: PMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1 libpq-dev

      - name: Install Python Dependencies & Dev Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff black pyright pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check backend ml

      - name: Verify Code Formatting with Black
        run: |
          black --check backend ml

      - name: Static Type Checking with Pyright
        run: |
          pyright

      - name: Generate Ephemeral CI Secrets
        run: |
          ADMIN_PWD="${{ secrets.CI_TEST_ADMIN_PASSWORD }}"
          [ -z "$ADMIN_PWD" ] && ADMIN_PWD=$(openssl rand -hex 32)
          echo "ADMIN_PASSWORD=$ADMIN_PWD" >> $GITHUB_ENV

          JWT_SEC="${{ secrets.CI_TEST_JWT_SECRET }}"
          [ -z "$JWT_SEC" ] && JWT_SEC=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SEC" >> $GITHUB_ENV

          API_KEY="${{ secrets.CI_TEST_API_KEY }}"
          [ -z "$API_KEY" ] && API_KEY=$(openssl rand -hex 32)
          echo "PMS_API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: sqlite:///./pms.db
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PMS_API_KEY: ${{ env.PMS_API_KEY }}
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=term-missing

  audit:
    name: Security Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit --desc --local

  docker-build:
    name: Build Docker Images (Breakage Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Dockerfile
        run: |
          docker build -t pms-backend:ci -f Dockerfile.backend .

      - name: Build Frontend Dockerfile
        run: |
          docker build -t pms-frontend:ci -f Dockerfile.frontend .

  frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: cd frontend && npm install && npm run build
