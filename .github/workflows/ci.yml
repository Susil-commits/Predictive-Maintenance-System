name: PMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1 libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./pms.db
          PMS_API_KEY: ${{ secrets.CI_TEST_API_KEY }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.CI_TEST_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET }}
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v

  frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: cd frontend && npm install && npm run build

