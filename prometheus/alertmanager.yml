global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: "pms-backend-webhook"

receivers:
  - name: "pms-backend-webhook"
    webhook_configs:
      - url: "http://backend:8000/ops/alerts/webhook"
        send_resolved: true
        # For hardened deployments requiring Bearer authentication, configure ALERTMANAGER_WEBHOOK_SECRET
        # on the backend and attach:
        # http_config:
        #   authorization:
        #     type: Bearer
        #     credentials_file: /run/secrets/alertmanager_webhook_secret
