[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/Lib/site-packages"
]

[tool.pyrefly]
venv = ".venv"
extraPaths = [
    ".venv/Lib/site-packages"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

